<!DOCTYPE html>
<html lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>בדיקת רכב לפי מספר רישוי</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> בדיקת רכב</a>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="container my-5">
        <h2 class="text-center mb-4"> הזן מספר רכב לקבלת מידע</h2>
            <form id="car-form" class="row g-3 justify-content-center">
                <div class="col-md-4">
                    <input type="text" id="car-number" class="form-control" placeholder="מספר-רישוי" required>

                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">חפש</button>
                </div>
            </form>
            <div id="result" class="mt-5"></div>
    </div>
    <!-- Bootstrap JS & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>

</html>
